services:
  # Frontend Service (Next.js)
  - type: web
    name: mwu-library-frontend
    env: node
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: NEXT_PUBLIC_API_URL
        value: https://mwu-library-backend.onrender.com/api.php
    
  # Backend Service (PHP/Laravel)
  - type: web
    name: mwu-library-backend
    env: php
    region: oregon
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php -S 0.0.0.0:$PORT -t public
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: mwu-library-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: mwu-library-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: mwu-library-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: mwu-library-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mwu-library-db
          property: password

databases:
  - name: mwu-library-db
    databaseName: mwu_library
    user: mwu_user
