<!DOCTYPE html>
<html>
<head>
    <title>Working Registration - MWU Library</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background: #f5f5f5; }
        .container { background: white; padding: 30px; border-radius: 10px; max-width: 500px; margin: 0 auto; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .alert { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head> 
<body>
    <div class="container">
        <h1>Student Registration</h1>
        <div id="message"></div>
        
        <form id="regForm">
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email (must end with @student.mwu.edu.et)" required>
            <input type="text" name="student_id" placeholder="Student ID" required>
            <input type="tel" name="phone" placeholder="Phone Number" required>
            <input type="password" name="password" placeholder="Password (min 6 characters)" required>
            <input type="password" name="confirm_password" placeholder="Confirm Password" required>
            <button type="submit">Register Student</button>
        </form>
    </div>

    <script>
        document.getElementById('regForm').onsubmit = async function(e) {
            e.preventDefault();
            
            const form = e.target;
            const data = {
                name: form.name.value,
                email: form.email.value,
                student_id: form.student_id.value,
                phone: form.phone.value,
                password: form.password.value,
                confirm_password: form.confirm_password.value
            };
            
            const msg = document.getElementById('message');
            
            // Simple validation
            if (data.password !== data.confirm_password) {
                msg.className = 'alert error';
                msg.textContent = 'Passwords do not match!';
                return;
            }
            
            if (data.password.length < 6) {
                msg.className = 'alert error';
                msg.textContent = 'Password must be at least 6 characters!';
                return;
            }
            
            if (!data.email.includes('@student.mwu.edu.et')) {
                msg.className = 'alert error';
                msg.textContent = 'Email must end with @student.mwu.edu.et';
                return;
            }
            
            try {
                const response = await fetch('/api.php/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    msg.className = 'alert success';
                    msg.textContent = 'Registration successful! You can now login.';
                    form.reset();
                } else {
                    msg.className = 'alert error';
                    msg.textContent = result.message || 'Registration failed';
                }
            } catch (error) {
                msg.className = 'alert error';
                msg.textContent = 'Network error: ' + error.message;
            }
        };
    </script>
</body>
</html>
